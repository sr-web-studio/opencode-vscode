name: Bug report
description: Something in the clients does not work as expected.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. This repository holds the unofficial clients (VS Code extension, OpenCode Voice, Android app, `opencode-push` plugin).
        Remove passwords, tokens and private addresses from logs before pasting them.
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - VS Code extension
        - OpenCode Voice (companion)
        - Android app
        - opencode-push plugin
    validations:
      required: true
  - type: input
    id: client-version
    attributes:
      label: Client version
      description: The extension or app version. For the plugin, the version in its `package.json` or the commit you run.
      placeholder: 0.3.10 / 0.2.2-beta
    validations:
      required: true
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode server version
      description: The version reported by `opencode --version` on the machine running the server.
      placeholder: 2.2.6
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11, macOS 15, Ubuntu 24.04, Android 15
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order, and what happened instead of what you expected.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The OpenCode output channel (VS Code) or the relevant `adb logcat` lines (Android). Remove passwords, tokens and private addresses.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: hygiene
    attributes:
      label: Before submitting
      options:
        - label: I removed passwords, tokens and private addresses from logs.
          required: true
        - label: This is a bug in a client, not in the OpenCode server itself.
          required: false
