name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Read-only: this workflow never publishes, signs or comments.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck (core, ui, extension, mobile, plugin)
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Plugin tests
        run: bun run test:plugin
      - name: Build extension and companion
        run: bun run build
      - name: Build mobile web app
        run: bun run mobile:build
      - name: Format check
        run: bun run format:check

  android:
    name: Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution and dependencies between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # `cap sync` creates capacitor.settings.gradle's sibling project
      # (capacitor-cordova-android-plugins/), which Gradle includes and which is not committed.
      - name: Sync Capacitor
        working-directory: apps/mobile
        run: bun run android:sync
      - name: JVM unit tests
        working-directory: apps/mobile/android
        run: ./gradlew testDebugUnitTest
