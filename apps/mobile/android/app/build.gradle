apply plugin: 'com.android.application'

// Test builds install next to the released app instead of replacing it:
//   ./gradlew assembleRelease -PtestBuild=19
// gives the id dev.srwebstudio.opencode.test, the name "OpenCode TEST 19" and the version 0.2.2-beta-test.19, signed with
// the release key like the normal build. The number is the build counter, as in the VS Code test builds
// (`bun run package -- --test 11`). Without the property the build keeps its released identity.
def versionNameBase = "0.2.4-beta"
def testNumber = project.findProperty("testBuild")?.toString()?.trim()
if (testNumber != null && testNumber.isEmpty()) {
    testNumber = null
}
if (testNumber != null && !(testNumber ==~ /\d+/)) {
    throw new GradleException("-PtestBuild needs a build number, for example -PtestBuild=19")
}
def appName = testNumber == null ? "OpenCode (unofficial)" : "OpenCode TEST ${testNumber}"
// The ongoing "watching your servers" notification: the released app says "OpenCode", the test build says so too.
def ongoingTitle = testNumber == null ? "OpenCode" : "OpenCode TEST ${testNumber}"

android {
    namespace = "dev.srwebstudio.opencode"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.srwebstudio.opencode"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 5
        versionName versionNameBase
        // The launcher label and the activity title live here, not in res/values/strings.xml, so a test build can say
        // which one it is. `cap sync` leaves strings.xml alone, so nothing writes them back.
        resValue "string", "app_name", appName
        resValue "string", "title_activity_main", appName
        resValue "string", "ongoing_title", ongoingTitle
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: the keystore lives outside the repo (default ~/.config/occ-android/release.jks, or
    // ANDROID_KEYSTORE_PATH). The password comes from the environment (ANDROID_KEYSTORE_PASSWORD, e.g. from the
    // git-ignored root .env). Without it a release build stays unsigned; debug builds are unaffected.
    def releaseStore = file(System.getenv("ANDROID_KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.config/occ-android/release.jks")
    def releasePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    signingConfigs {
        release {
            if (releaseStore.exists() && releasePassword) {
                storeFile releaseStore
                storePassword releasePassword
                keyAlias "opencode-mobile"
                keyPassword releasePassword
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore.exists() && releasePassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // A test build gets its own id (and so its own data, service and notifications) and a version that ranks below the
    // release it is based on, so installing it never replaces the released app. Applied to every build type: a debug
    // build with the property is just as much a test build.
    buildTypes.all { type ->
        if (testNumber != null) {
            type.applicationIdSuffix = ".test"
            type.versionNameSuffix = "-test.${testNumber}"
        }
    }
}

// The test APK's file name says which build it is: opencode-mobile-0.2.2-beta-test.19.apk. The normal release keeps
// its default app-release.apk.
androidComponents {
    onVariants(selector().all()) { variant ->
        if (testNumber == null) return
        variant.outputs.each { output ->
            output.outputFileName.set("opencode-mobile-${versionNameBase}-test.${testNumber}.apk")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.core:core:$androidxCoreVersion"
    testImplementation "junit:junit:$junitVersion"
    // android.jar only has stubs of org.json: the JVM unit tests need the real one.
    testImplementation "org.json:json:20240303"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
